name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test calculator
        run: |
          python -c "from calculadora import sumar, restar; assert sumar(5, 3) == 8; assert restar(10, 4) == 6"